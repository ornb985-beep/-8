name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux · fmt, clippy, tests, C ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustup target add aarch64-apple-darwin
      - name: Checks
        run: scripts/check.sh
      - name: Type-check the Hypervisor.framework backend for aarch64-apple-darwin
        run: cargo clippy --workspace --all-targets --target aarch64-apple-darwin -- -D warnings

  macos:
    name: macOS arm64 · VMM + ApexStudio.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Tests (native)
        run: cargo test --workspace
      - name: Build and sign VMM + frontend
        run: scripts/build-macos.sh
      - name: C ABI smoke test
        run: |
          cc -std=c11 -Wall -Werror -I include -o target/abi_smoke tests/c/abi_smoke.c \
             target/release/libapex_vmm.a -framework Hypervisor
          ./target/abi_smoke
      - name: Host capabilities
        run: out/apex caps
      - name: Package
        run: |
          cd out && ditto -c -k --keepParent ApexStudio.app ApexStudio.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apex-macos-arm64
          path: |
            out/apex
            out/ApexStudio.zip
